
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>SaltStack — What's New</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Ubuntu, sans-serif;
            line-height: 1.6;
            padding: 40px;
            background: #ffffff;
            color: #24292e;
        }

        body.dark {
            background: #1e1e1e;
            color: #cccccc;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
        }

        h1 {
            margin-bottom: 24px;
        }

        .version {
            display: none;
            margin-bottom: 32px;
            padding: 24px;
            border-radius: 8px;
            background: #f6f8fa;
            border: 1px solid #e1e4e8;
        }

        body.dark .version {
            background: #2d2d2d;
            border-color: #444;
        }

        .version h2 {
            margin-bottom: 12px;
        }

        ul {
            padding-left: 20px;
        }

        .meta {
            margin-bottom: 24px;
            font-size: 0.9em;
            opacity: 0.7;
        }

        code {
            background: rgba(0,0,0,0.05);
            padding: 2px 6px;
            border-radius: 4px;
        }

        body.dark code {
            background: rgba(255,255,255,0.1);
        }
    </style>
</head>

<body>
<div class="container">
    <h1>SaltStack — What’s New</h1>

    <div class="meta">
        Version: <code id="currentVersion">unknown</code> ·
        Theme: <code id="currentTheme">unknown</code>
    </div>

    <section class="version" data-version="2026.2.1">
      <h2>Version 2026.2.1</h2>
      <p><strong>top.sls</strong></p>
      
    </section>
    <section class="version" data-version="2026.2.0">
      <h2>Version 2026.2.0</h2>
      <p><strong> test </strong></p>
      
    </section>

    <!-- ===================== -->
    <!-- FALLBACK -->
    <!-- ===================== -->
    <section class="version" data-version="latest">
        <h2>Latest</h2>
        <p>This page shows the latest available changes.</p>
    </section>
</div>

<script>
    (function () {

        let version = 'latest';
        let colorScheme = 'light';

        if (location.hash) {
            const hash = location.hash.substring(1); // without #
            const [hashVersion, hashQuery] = hash.split('?');

            if (hashVersion) {
                version = hashVersion;
            }

            if (hashQuery) {
                const hashParams = new URLSearchParams(hashQuery);
                colorScheme = hashParams.get('colorScheme') || colorScheme;
            }
        }

        // normal query (если URL исправят)
        const searchParams = new URLSearchParams(location.search);
        colorScheme = searchParams.get('colorScheme') || colorScheme;

        // apply theme
        if (colorScheme === 'dark') {
            document.body.classList.add('dark');
        }

        // show version
        const blocks = document.querySelectorAll('.version');
        let shown = false;

        blocks.forEach(block => {
            if (block.dataset.version === version) {
                block.style.display = 'block';
                shown = true;
                block.scrollIntoView({ block: 'start' });
            }
        });

        if (!shown) {
            document.querySelector('[data-version="latest"]').style.display = 'block';
        }

        document.getElementById('currentVersion').textContent = version;
        document.getElementById('currentTheme').textContent = colorScheme;
    })();
</script>
</body>
</html>
